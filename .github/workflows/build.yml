name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Kscan.slnx

      - name: Build
        run: dotnet build Kscan.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Kscan.slnx -c Release --no-build --logger "console;verbosity=normal"
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
